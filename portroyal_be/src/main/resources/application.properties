server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SERVER_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

#### Custom Properties ####
be_app.baseurl=prbe.matteopaciolla.com
be_app.user.telegram_unification.enabled=true
be_app.user.telegram_unification.max_retries=3
be_app.cache.match.seconds-to-expire=3600

#### OAuth 2.1 / OpenID Connect ####
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

pr.auth.issuer=${PORTROYAL_AUTH_ISSUER:http://localhost:8080}
pr.auth.api-audience=${PORTROYAL_API_AUDIENCE:portroyal-api}
pr.auth.web-client-id=${PORTROYAL_WEB_CLIENT_ID:portroyal-web}
pr.auth.web-redirect-uris=${PORTROYAL_WEB_REDIRECT_URIS:http://localhost:3000/auth/callback}
pr.auth.web-post-logout-redirect-uris=${PORTROYAL_WEB_LOGOUT_REDIRECT_URIS:http://localhost:3000/}
pr.auth.cli-client-id=${PORTROYAL_CLI_CLIENT_ID:portroyal-cli}
pr.auth.cli-redirect-uri=${PORTROYAL_CLI_REDIRECT_URI:http://127.0.0.1:8765/callback}
pr.auth.bot-client-id=${PORTROYAL_BOT_CLIENT_ID:portroyal-telegram-bot}
pr.auth.bot-client-secret=${PORTROYAL_BOT_CLIENT_SECRET:}
pr.auth.bootstrap-admin-enabled=${PORTROYAL_BOOTSTRAP_ADMIN_ENABLED:false}
pr.auth.initial-admin-password=${PORTROYAL_INITIAL_ADMIN_PASSWORD:}
pr.auth.bot-username=shaslabot
pr.auth.key-store-location=${PORTROYAL_AUTH_KEYSTORE:}
pr.auth.key-store-password=${PORTROYAL_AUTH_KEYSTORE_PASSWORD:}
pr.auth.key-alias=${PORTROYAL_AUTH_KEY_ALIAS:portroyal-signing}
pr.auth.public-key-aliases=${PORTROYAL_AUTH_PUBLIC_KEY_ALIASES:}
pr.auth.access-token-ttl=PT5M
pr.auth.refresh-token-ttl=PT8H
pr.auth.login-rate-limit.window=${PORTROYAL_LOGIN_RATE_LIMIT_WINDOW:PT15M}
pr.auth.login-rate-limit.account-attempts=${PORTROYAL_LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:5}
pr.auth.login-rate-limit.address-attempts=${PORTROYAL_LOGIN_RATE_LIMIT_ADDRESS_ATTEMPTS:100}
pr.api.cors.allowed-origins=${PORTROYAL_API_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
pr.sentinel.callback-encryption-key=${PORTROYAL_CALLBACK_ENCRYPTION_KEY:}
pr.sentinel.callback-encryption-key-id=${PORTROYAL_CALLBACK_ENCRYPTION_KEY_ID:current}
pr.sentinel.callback-previous-encryption-keys=${PORTROYAL_CALLBACK_PREVIOUS_ENCRYPTION_KEYS:}
