#### Spring Boot Configuration ####
spring.jpa.open-in-view=false
# needed for avoiding the error: AsyncRequestTimeoutException when using Long Polling
spring.mvc.async.request-timeout=-1
# WebConfig prefixes Springdoc's REST controller; the effective URL is /api/v1/api-docs.
springdoc.api-docs.path=/api-docs
###### Database Configuration ######
#spring.datasource.url=jdbc:postgresql://mightyshaman.com:5432/prdb
