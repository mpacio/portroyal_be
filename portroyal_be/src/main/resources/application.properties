#### Spring Boot Configuration ####
spring.jpa.open-in-view=false
# needed for avoiding the error: AsyncRequestTimeoutException when using Long Polling
spring.mvc.async.request-timeout=3660000
# WebConfig prefixes Springdoc's REST controller; the effective URL is /api/v1/api-docs.
springdoc.api-docs.path=/api-docs
###### Database Configuration ######
#spring.datasource.url=jdbc:postgresql://mightyshaman.com:5432/prdb
#spring.datasource.username=user
#spring.datasource.password=pass
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
###### Database Configuration ######

###### Variables from Maven pom.xml ######
portroyal.lib.version=@prlib.version@
###### Variables from Maven pom.xml ######
#### Spring Boot Configuration ####

#### Persistence ####
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#### Persistence ####

