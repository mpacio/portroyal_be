#### Logging with Spring Boot Actuator ####

#### Logging with Logbook ####
logbook.filter.enabled=true
logbook.format.style=default
logging.level.org.zalando.logbook=INFO
#### Logging with Logbook ####

#### Common Properties ####
server.port=8080
server.tomcat.max-http-form-post-size=2097152
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${NPM_INTERNAL_PROXY_REGEX:127[.]0[.]0[.]1}
app.http.max-request-body-bytes=2097152
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.distribution.percentiles-histogram.http.server.requests=true

#### Custom Properties ####
be_app.baseurl=prbe.mightyshaman.com
be_app.user.telegram_unification.enabled=true
be_app.user.telegram_unification.max_retries=3
be_app.cache.match.seconds-to-expire=3600
app.oauth2.issuer=${OAUTH2_ISSUER:}
app.oauth2.bot.client-id=${OAUTH2_BOT_CLIENT_ID:}
app.oauth2.signing-key.path=${OAUTH2_SIGNING_KEY_PATH:}
app.oauth2.signing-key.password=${OAUTH2_SIGNING_KEY_PASSWORD:}
app.oauth2.signing-key.password-file=${OAUTH2_SIGNING_KEY_PASSWORD_FILE:}
app.oauth2.signing-key.alias=${OAUTH2_SIGNING_KEY_ALIAS:portroyal-signing}
