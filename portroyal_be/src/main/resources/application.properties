#spring.datasource.password=pass
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
###### Database Configuration ######

###### Variables from Maven pom.xml ######
portroyal.lib.version=@prlib.version@
###### Variables from Maven pom.xml ######
#### Spring Boot Configuration ####

#### Schema Generation (just for development) ####
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=create-schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=drop-schema.sql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#### Schema Generation (just for development) ####

