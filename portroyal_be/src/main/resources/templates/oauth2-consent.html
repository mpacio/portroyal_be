<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorize Port Royal client</title>
</head>
<body>
<main>
    <h1>Authorize access</h1>
    <p th:text="${clientName} + ' is requesting access to your Port Royal account.'"></p>
    <form method="post" action="/oauth2/authorize">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="client_id" th:value="${clientId}">
        <input type="hidden" name="state" th:value="${state}">
        <fieldset>
            <legend>Requested permissions</legend>
            <div th:each="scope : ${scopes}">
                <label>
                    <input type="checkbox" name="scope" th:value="${scope}">
                    <span th:text="${scope}"></span>
                </label>
            </div>
        </fieldset>
        <button type="submit" name="user_oauth_approval" value="true">Authorize</button>
        <button type="submit" name="user_oauth_approval" value="false">Deny</button>
    </form>
</main>
</body>
</html>
