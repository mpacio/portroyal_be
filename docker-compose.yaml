---
services:
  postgres:
    image: postgres:16.3-bookworm
    container_name: postgresc
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Europe/Rome
      - PGTZ=Europe/Rome
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  be_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portroyal-be-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      NPM_INTERNAL_PROXY_REGEX: ${NPM_INTERNAL_PROXY_REGEX:?Set NPM_INTERNAL_PROXY_REGEX to the trusted NPM address}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:?Set OAUTH2_ISSUER}
      OAUTH2_BOT_CLIENT_ID: ${OAUTH2_BOT_CLIENT_ID:?Set OAUTH2_BOT_CLIENT_ID}
      OAUTH2_SIGNING_KEY_PATH: /run/secrets/oauth2_signing_keystore
      OAUTH2_SIGNING_KEY_PASSWORD_FILE: /run/secrets/oauth2_signing_password
      OAUTH2_SIGNING_KEY_ALIAS: ${OAUTH2_SIGNING_KEY_ALIAS:-portroyal-signing}
    volumes:
      - ~/appdata/portroyal-be-app/logs:/app/logs
    secrets:
      - source: oauth2_signing_keystore
        target: oauth2_signing_keystore
      - source: oauth2_signing_password
        target: oauth2_signing_password
    expose:
      - "8080"
    networks:
      npm_main_net:
        aliases:
          - portroyal-be-app
      backend_internal:
networks:
  npm_main_net:
    name: npm_main_net
    external: true
  backend_internal:
    internal: true
volumes:
  postgres_data:
secrets:
  oauth2_signing_keystore:
    file: ${OAUTH2_SIGNING_KEY_FILE:?Set OAUTH2_SIGNING_KEY_FILE}
  oauth2_signing_password:
    file: ${OAUTH2_SIGNING_KEY_PASSWORD_FILE:?Set OAUTH2_SIGNING_KEY_PASSWORD_FILE}